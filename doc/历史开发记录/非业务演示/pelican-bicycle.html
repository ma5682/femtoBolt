<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕的海岸骑行</title>
<style>
  :root{color-scheme:light;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#244a4c;background:#f5f1e7}
  *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px}
  main{width:min(1080px,100%)}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:23px}
  .eyebrow{font-size:11px;letter-spacing:3px;color:#638381;margin:0 0 9px}h1{font-size:clamp(26px,4vw,42px);font-weight:650;letter-spacing:-1px;margin:0}header p{font-size:13px;color:#68817b;margin:0 0 5px}
  .scene{position:relative;overflow:hidden;border-radius:24px;border:1px solid #d3ded2;box-shadow:0 20px 60px #274f4310;background:#dceee3}
  svg{display:block;width:100%;height:auto}.ink{stroke:#294e50;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  footer{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:20px 2px;color:#617d77;font-size:12px}
  .controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}button{font:inherit;font-size:13px;background:#294e50;color:#fff;border:0;border-radius:999px;padding:11px 22px;cursor:pointer;min-width:105px}button:hover{background:#3d6867}button:focus-visible,input:focus-visible{outline:3px solid #e58c4f;outline-offset:4px}label{display:flex;align-items:center;gap:9px}input{width:100px;accent-color:#337773}output{min-width:32px;font-variant-numeric:tabular-nums}.caption{letter-spacing:1px}
  @media(max-width:600px){body{padding:18px 12px}header{display:block}header p{margin-top:10px}.scene{border-radius:16px}footer{padding:16px 2px}}
</style>
</head>
<body>
<main>
  <header><div><p class="eyebrow">LITTLE COASTAL JOURNEYS / 01</p><h1>今天，骑去海边。</h1></div><p>一只鹈鹕 · 一辆单车 · 不赶时间</p></header>
  <div class="scene">
  <svg id="scene" viewBox="0 0 1000 650" role="img" aria-labelledby="sceneTitle sceneDesc">
    <title id="sceneTitle">鹈鹕骑自行车的二维动画</title>
    <desc id="sceneDesc">戴着绿色围巾的白色鹈鹕骑一辆珊瑚红自行车，脚踏板与车轮转动，沿着海岸公路向前行驶。</desc>
    <defs>
      <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d8eae1"/><stop offset="1" stop-color="#eff1d9"/></linearGradient>
      <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#99c9be"/><stop offset="1" stop-color="#c6ded0"/></linearGradient>
      <pattern id="road" width="190" height="22" patternUnits="userSpaceOnUse"><path d="M18 11h74" stroke="#f4eed8" stroke-width="5" stroke-linecap="round"/></pattern>
      <g id="cloud" fill="#fffdf2"><path d="M0 28C-8 11 14 0 29 9C32-13 68-14 76 8C96-3 118 13 112 28Z"/></g>
      <g id="spokes" stroke="#8eaaa4" stroke-width="2"><path d="M-79 0H79M0-79V79M-56-56 56 56M-56 56 56-56M-73-30 73 30M-73 30 73-30M-30-73 30 73M-30 73 30-73"/><path d="M34-65l8 6" stroke="#f5c27b" stroke-width="7" stroke-linecap="round"/></g>
      <g id="plant" fill="none" stroke="#729789" stroke-width="3" stroke-linecap="round"><path d="M0 0q-1-22-14-31M0 0q5-30 19-40M0 0q-8-13-22-15"/></g>
    </defs>
    <path fill="url(#sky)" d="M0 0h1000v650H0z"/>
    <circle cx="790" cy="117" r="59" fill="#f6d392"/><circle cx="790" cy="117" r="76" fill="none" stroke="#f6d392" stroke-opacity=".24" stroke-width="15"/>
    <g id="clouds" opacity=".8"><use href="#cloud" x="90" y="120"/><use href="#cloud" x="420" y="70" transform="translate(100 25) scale(.8)"/><use href="#cloud" x="890" y="177"/></g>
    <path d="M0 298Q140 243 283 291T570 281T1000 274V419H0Z" fill="#aac8b9"/>
    <path d="M0 330Q230 306 460 329T1000 321V467H0Z" fill="url(#sea)"/>
    <g stroke="#eff4df" stroke-width="3" stroke-linecap="round" opacity=".6"><path d="M70 363h95m118-16h42m363 17h140M475 397h81m285 18h101M106 421h134"/></g>
    <g fill="none" stroke="#6a928a" stroke-width="3" stroke-linecap="round"><path d="M207 208q12-14 24 0q12-14 24 0M281 180q8-10 16 0q8-10 16 0"/></g>
    <path d="M0 441Q320 411 1000 452V650H0Z" fill="#dfdbbb"/>
    <path d="M0 486H1000V601H0Z" fill="#a4b5a6"/><path d="M0 493H1000" stroke="#f8f0d5" stroke-width="4"/>
    <rect y="558" width="1000" height="22" fill="url(#road)"/>
    <g id="plants"><use href="#plant" x="100" y="475"/><use href="#plant" x="851" y="468"/><use href="#plant" x="537" y="638"/><use href="#plant" x="1120" y="632"/></g>
    <ellipse cx="503" cy="538" rx="231" ry="15" fill="#335f57" opacity=".12"/>
    <g id="rider">
      <!-- Bicycle wheels and rotating spokes -->
      <g transform="translate(335 446)"><circle r="88" fill="#e2e8d4" fill-opacity=".3" stroke="#294e50" stroke-width="12"/><circle r="80" fill="none" stroke="#f5efd9" stroke-width="3"/><g id="rearSpokes"><use href="#spokes"/></g><circle r="8" fill="#294e50"/></g>
      <g transform="translate(672 446)"><circle r="88" fill="#e2e8d4" fill-opacity=".3" stroke="#294e50" stroke-width="12"/><circle r="80" fill="none" stroke="#f5efd9" stroke-width="3"/><g id="frontSpokes"><use href="#spokes"/></g><circle r="8" fill="#294e50"/></g>
      <path d="M249 431a88 88 0 0 1 173-7M587 423a89 89 0 0 1 171 2" fill="none" stroke="#eab38d" stroke-width="5" stroke-linecap="round"/>
      <path id="farLeg" d="M477 308L524 354 492 420" fill="none" stroke="#c08a44" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M335 446 416 335 493 446 335 446M416 335H618L493 446M605 307 672 446M416 335 405 308" fill="none" stroke="#294e50" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M335 446 416 335 493 446 335 446M416 335H618L493 446M605 307 672 446M416 335 405 308" fill="none" stroke="#dc7b62" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M602 307 594 278 623 265 646 266" class="ink" fill="none"/><path d="M630 265h21" stroke="#294e50" stroke-width="10" stroke-linecap="round"/>
      <path d="M380 309q27-11 54-2q8 13-12 14h-35q-16-1-7-12" fill="#294e50"/>
      <path d="M337 449 491 463Q513 447 493 429L335 438Z" fill="#d1dfca" stroke="#567974" stroke-width="3"/>
      <circle cx="493" cy="446" r="20" fill="#f5e9c9" stroke="#294e50" stroke-width="4"/>
      <g id="crank"><path d="M-28 0H28" stroke="#294e50" stroke-width="6" stroke-linecap="round"/><circle r="5" fill="#dc7b62"/></g>
      <!-- Pelican silhouette, pouch, wing and scarf -->
      <g id="bird">
        <path d="M415 287 365 263 383 306 354 295Q379 334 428 331" fill="#e2e7d9" class="ink"/>
        <path d="M406 258Q435 229 490 254Q516 267 534 247Q550 223 548 193Q541 165 558 147Q580 122 603 141Q625 158 607 193Q590 222 594 252Q602 306 550 332Q494 360 440 329Q414 313 406 258Z" fill="#fffcdf" class="ink"/>
        <path d="M449 271Q494 260 530 294Q502 332 453 300" fill="#d7e1d7" stroke="#90aaa0" stroke-width="3" stroke-linecap="round"/>
        <path d="m465 283 36 17m-25-24 37 17" stroke="#b0c2b7" stroke-width="3" stroke-linecap="round"/>
        <path d="M599 171 741 192Q686 208 614 217Q590 209 599 171Z" fill="#edb86e" class="ink"/>
        <path d="M600 169Q664 164 746 190L602 191Z" fill="#f4ce80" class="ink"/>
        <path d="M617 200q31 6 58 0" fill="none" stroke="#d59a53" stroke-width="3" stroke-linecap="round"/>
        <circle cx="590" cy="160" r="6" fill="#294e50"/><circle cx="592" cy="158" r="1.8" fill="white"/>
        <path d="M570 135q-13-12-19-8m27 8q-5-17-12-18" fill="none" class="ink"/>
        <path d="M548 221q21 13 44 2l-1 17q-23 10-44-3Z" fill="#428e81" stroke="#294e50" stroke-width="3"/>
        <path id="scarf" d="M550 229Q515 222 488 209L494 229 479 239Q519 248 550 238Z" fill="#428e81" stroke="#294e50" stroke-width="3"/>
        <path d="M533 273Q574 295 624 270" fill="none" stroke="#294e50" stroke-width="15" stroke-linecap="round"/><path d="M533 271Q574 291 622 269" fill="none" stroke="#f5f2d9" stroke-width="10" stroke-linecap="round"/>
      </g>
      <path id="nearLeg" d="M486 321 520 365 521 446" fill="none" stroke="#e5ac5a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="nearFoot" d="M0 0h25l-7-9" fill="#e5ac5a" stroke="#294e50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="farFoot" d="M0 0h22l-6-8" fill="#c08a44" stroke="#294e50" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g fill="#64877c" font-family="system-ui,sans-serif" font-size="11" letter-spacing="3"><text x="40" y="48">COASTLINE CYCLING CLUB</text><text x="40" y="620">SLOW DAYS, HAPPY WHEELS.</text></g>
  </svg>
  </div>
  <footer><div class="controls"><button id="toggle" type="button" aria-pressed="false">暂停骑行</button><label for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speedValue" for="speed">1×</output></label></div><span class="caption">纯 SVG 绘制 · 给日常一点海风</span></footer>
</main>
<script>
(() => {
  const byId = id => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let running = !reduced.matches, elapsed = 0, previous = null;
  const toggle = byId('toggle'), speed = byId('speed');
  function updateButton(){toggle.textContent=running?'暂停骑行':'开始骑行';toggle.setAttribute('aria-pressed',String(!running));}
  toggle.addEventListener('click',()=>{running=!running;updateButton();});
  speed.addEventListener('input',()=>byId('speedValue').textContent=`${speed.value}×`);
  reduced.addEventListener('change',e=>{if(e.matches){running=false;updateButton();}});
  function draw(t){
    const angle=t*3.7, deg=angle*180/Math.PI;
    byId('rearSpokes').setAttribute('transform',`rotate(${deg*.85})`);
    byId('frontSpokes').setAttribute('transform',`rotate(${deg*.85})`);
    byId('crank').setAttribute('transform',`translate(493 446) rotate(${deg})`);
    for(const [name,phase,hip] of [['far',Math.PI,[477,320]],['near',0,[486,329]]]){
      const x=493+28*Math.cos(angle+phase),y=446+28*Math.sin(angle+phase);
      const dx=x-hip[0],dy=y-hip[1],length=Math.hypot(dx,dy);
      const bend=Math.sqrt(Math.max(0,77*77-length*length/4));
      const kneeX=(hip[0]+x)/2+dy/length*bend,kneeY=(hip[1]+y)/2-dx/length*bend;
      byId(name+'Leg').setAttribute('d',`M${hip[0]} ${hip[1]}L${kneeX} ${kneeY} ${x} ${y}`);
      byId(name+'Foot').setAttribute('transform',`translate(${x-7} ${y})`);
    }
    byId('rider').setAttribute('transform',`translate(0 ${Math.sin(angle*2)*1.3})`);
    byId('scarf').setAttribute('transform',`rotate(${Math.sin(angle*1.4)*3} 550 233)`);
    byId('road').setAttribute('patternTransform',`translate(${-t*94%190} 0)`);
    byId('plants').setAttribute('transform',`translate(${-t*94%1200} 0)`);
    byId('clouds').setAttribute('transform',`translate(${-t*9%1150} 0)`);
  }
  function frame(now){if(previous!==null && running && !document.hidden)elapsed+=Math.min((now-previous)/1000,.05)*Number(speed.value);previous=now;draw(elapsed);requestAnimationFrame(frame);}
  updateButton();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
